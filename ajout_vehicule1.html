<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body bgcolor="purple">
<h1> Ajout d'un nouveau véhicule </h1>
    <form>
        <table border="0" width="50%">
            <tr><td><label for="marque">Marque :</label></td>
                <td><select id="marque" name="marque">
                        <option value="Peugeot">Peugeot</option>
                        <option value="Renault">Renault</option>
                        <option value="Mercedes">Mercedes</option>
                    </select></td></tr>                  
            <tr> <td><label for="immatriculation">Immatriculation :</label></td>
            	<td><input type="text" id="immatriculation" name="immatriculation"></td> </tr>
            	<tr> <td><label for="couleur">Couleur :</label></td>
				<td> <input type = "text" id="couleur" name="couleur"> </td> </tr>
				<tr> <td><label for="date_immat">Date d'immatriculation :</label></td>
				<td> <input type = "date" id="date_immat" name="date_immat"> </td> </tr>
				<tr><td><label for="kilometrage">Kilométrage :</label></td>
    			<td><input type="number" id="kilometrage" name="kilometrage" min="0"></td></tr>
    			<tr><td><label>État :</label></td><td>
    				<input type="radio" id="etat_occasion" name="etat" value="Occasion"><label for="etat_occasion">Occasion</label>
    				<input type="radio" id="etat_neuf" name="etat" value="Neuf"><label for="etat_neuf">Neuf</label></td></tr>	
				<tr><td><label>Carburant :</label></td><td>
				<input type="radio" id="carb_hybride" name="carburant" value="Hybride"><label for="carb_hybride">Hybride</label>
				<input type="radio" id="carb_electrique" name="carburant" value="Electrique"><label for="carb_electrique">Électrique</label>
				<input type="radio" id="carb_diesel" name="carburant" value="Diesel"><label for="carb_diesel">Diesel</label>
				<input type="radio" id="carb_essence" name="carburant" value="Essence"><label for="carb_essence">Essence</label></td></tr>  
				<tr> <td><label for="bdv">Boite de vitesse :</label></td>
            	<td><input type="text" id="bdv" name="bdv"></td> </tr>	
				<tr> <td><label for="nb_portes">Nombre de portes :</label></td>
            	<td><input type="text" id="nb_portes" name="nb_portes"></td> </tr>	
            	<tr> <td><label for="dateachat">Date d'achat : :</label></td>
            	<td><input type="text" id="dateachat" name="dateachat"></td> </tr>	
				<tr> <td><label for="assurance">Assurance :</label></td>
            	<td><input type="text" id="assurance" name="assurance"></td> </tr>	
            	<tr><td colspan="2">
				<button type="submit">Enregistrer</button>
				<button type="reset">Annuler</button></td></tr>

        </table>
    </form>
</body>
</html>
